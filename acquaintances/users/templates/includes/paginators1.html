{% load static %}

<div class="content_all">
    <!-- Пагинация -->
    {% if ratings_page.has_other_pages %}
    <div style="text-align: center; margin: 30px 0;">
        <nav aria-label="Page navigation">
            <ul class="pagination">
                <!-- Кнопка «Назад» -->
                {% if ratings_page.has_previous %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ ratings_page.previous_page_number }}">Назад</a>
                </li>
                {% endif %}

                <!-- Текущая страница -->
                <li class="page-item active">
                    <span class="page-link">{{ ratings_page.number }} из {{ ratings_page.paginator.num_pages }}</span>
                </li>

                <!-- Кнопка «Вперёд» -->
                {% if ratings_page.has_next %}
                <li class="page-item">
                    <a class="page-link" href="?page={{ ratings_page.next_page_number }}">Вперёд</a>
                </li>
                {% endif %}
            </ul>
        </nav>
    </div>
    {% endif %}
</div>
